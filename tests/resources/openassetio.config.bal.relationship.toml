[manager]
identifier = "org.openassetio.examples.manager.bal"

[manager.settings]
library_json = """
{
  "managementPolicy": {
    "read": {
      "default": {
        "openassetio-mediacreation:managementPolicy.Managed": {}
      }
    }
  },
  "entities": {
    "test/shot": {
      "versions": [
        {
          "traits": {
            "openassetio-mediacreation:usage.Entity": {}
          }
        }
      ],
      "relations": [
        {
          "traits": {
            "openassetio-mediacreation:relationship.SourceRelationship": {}
          },
          "entities": ["test/shot/asset_a", "test/shot/asset_b"],
          "access": "read"
        }
      ]
    },
    "test/shot/asset_a": {
      "versions": [
        {
          "traits": {
            "openassetio-mediacreation:usage.Entity": {},
            "openassetio-mediacreation:content.LocatableContent": {
              "location": "file:///mnt/assets/asset_a.exr"
            }
          }
        }
      ]
    },
    "test/shot/asset_b": {
      "versions": [
        {
          "traits": {
            "openassetio-mediacreation:usage.Entity": {},
            "openassetio-mediacreation:content.LocatableContent": {
              "location": "file:///mnt/assets/asset_b.exr"
            }
          }
        }
      ]
    },
    "test/isolated": {
      "versions": [
        {
          "traits": {
            "openassetio-mediacreation:usage.Entity": {}
          }
        }
      ]
    }
  }
}
"""
